# 记账软件 · 原生重写版
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true

# 上一版（60 个脚本）在这台机器上必须 parallel=false / workers.max=2，
# 否则并发生成访问器文件会丢路径。单模块只有 1 个脚本 scope、几十个文件，
# 不再有那个量级的并发写入，所以这里可以放开。若出现 FileNotFoundException 再降。
org.gradle.parallel=true
org.gradle.workers.max=4

kotlin.daemon.jvmargs=-Xmx2048m

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# 工作区路径含中文，AGP 默认拒绝构建
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=35
