# 记账软件 · 原生重写版
# 这里**不要**再写 -Dfile.encoding=UTF-8（Gradle 模板的默认样板行）。
#
# Gradle 用「守护进程的默认字符集」写 test worker 的 @argfile，而 JDK 启动器在
# JVM 起来之前就展开了那个 argfile，用的是**平台 ANSI 代码页**。本工作区路径含中文
# （D:\记账软件），两边编码一旦不一致，类路径里的中文就被解成乱码，单测 worker
# 报 ClassNotFoundException，且看起来像是「测试类没编译」——极难排查。
# 留空即跟随平台编码，与启动器按构造对齐；对纯 ASCII 路径无影响。
# 排查过程见 docs/测试与迁移-1.0.4.md。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
org.gradle.configuration-cache=false
org.gradle.caching=true

# 上一版（60 个脚本）在这台机器上必须 parallel=false / workers.max=2，
# 否则并发生成访问器文件会丢路径。单模块只有 1 个脚本 scope、几十个文件，
# 不再有那个量级的并发写入，所以这里可以放开。若出现 FileNotFoundException 再降。
org.gradle.parallel=true
org.gradle.workers.max=4

kotlin.daemon.jvmargs=-Xmx2048m

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# 工作区路径含中文，AGP 默认拒绝构建
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=35
